name: Unit Tests
on:
  workflow_dispatch:

jobs:
  node-tests:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "18.19.0"
          - "18"
          - "20.6.0"
          - "20"
          - "22"
          - "23"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      # npm@11.0.0 drops support for Node.js v18
      # Install the latest npm compatible with this version of Node.js
      # - npm@11.1.0 supports: {"node":"^20.17.0 || >=22.9.0"}
      - run: npm install -g npm@"<11.0.0"
        if: ${{
          matrix.node_version == '18.19.0' ||
          matrix.node_version == '18' ||
          matrix.node_version == '20.6.0'
          }}
      - run: npm install -g npm@11.3.0
        if: ${{
          matrix.node_version == '20' ||
          matrix.node_version == '22' ||
          matrix.node_version == '23'
          }}

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - if: ${{ matrix.node_version != '22' && matrix.node_version != '23' }}
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          sed 's/\x1b\[[0-9;]*m//g' test-output.log | awk 'match($0, /[0-9]+ passing/) {split(substr($0, RSTART, RLENGTH), a, " "); s+=a[1]; n++} END {printf "TEST SUMMARY: %d tests passing across %d mocha suites\n", s, n}'
          sed 's/\x1b\[[0-9;]*m//g' test-output.log | awk 'match($0, /[0-9]+ failing/) {split(substr($0, RSTART, RLENGTH), a, " "); s+=a[1]} END {printf "TEST SUMMARY: %d tests failing\n", s}'
      # Node.js 23 type stripping conflicts with mocha usage of ts-node.
      # See https://github.com/open-telemetry/opentelemetry-js/issues/5415
      - env:
          NODE_OPTIONS: '--no-experimental-strip-types'
        if: ${{ matrix.node_version == '22' || matrix.node_version == '23' }}
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          sed 's/\x1b\[[0-9;]*m//g' test-output.log | awk 'match($0, /[0-9]+ passing/) {split(substr($0, RSTART, RLENGTH), a, " "); s+=a[1]; n++} END {printf "TEST SUMMARY: %d tests passing across %d mocha suites\n", s, n}'
          sed 's/\x1b\[[0-9;]*m//g' test-output.log | awk 'match($0, /[0-9]+ failing/) {split(substr($0, RSTART, RLENGTH), a, " "); s+=a[1]} END {printf "TEST SUMMARY: %d tests failing\n", s}'
      - name: Pack @opentelemetry/exporter-prometheus
        if: ${{ matrix.node_version == '18' }}
        run: |
          mkdir -p dist-pack
          npm pack --ignore-scripts --workspace=experimental/packages/opentelemetry-exporter-prometheus --pack-destination=dist-pack
          mv dist-pack/opentelemetry-exporter-prometheus-0.200.0.tgz dist-pack/exporter-prometheus-0.200.0.tgz
      - name: Upload exporter-prometheus tarball
        if: ${{ matrix.node_version == '18' }}
        uses: actions/upload-artifact@v4
        with:
          name: exporter-prometheus-tgz
          path: dist-pack/exporter-prometheus-0.200.0.tgz
          if-no-files-found: error
  node-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: '20'

      - run: npm install -g npm@11.3.0

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npm run compile

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test-output.log
          sed 's/\x1b\[[0-9;]*m//g' test-output.log | awk 'match($0, /[0-9]+ passing/) {split(substr($0, RSTART, RLENGTH), a, " "); s+=a[1]; n++} END {printf "TEST SUMMARY: %d tests passing across %d mocha suites\n", s, n}'
          sed 's/\x1b\[[0-9;]*m//g' test-output.log | awk 'match($0, /[0-9]+ failing/) {split(substr($0, RSTART, RLENGTH), a, " "); s+=a[1]} END {printf "TEST SUMMARY: %d tests failing\n", s}'
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee test-output.log
          sed 's/\x1b\[[0-9;]*m//g' test-output.log | awk 'match($0, /Executed [0-9]+ of [0-9]+.*SUCCESS \(/) {split(substr($0, RSTART, RLENGTH), a, " "); s+=a[2]; t+=a[4]; n++} END {printf "TEST SUMMARY: %d of %d tests executed successfully across %d karma suites\n", s, t, n}'
  webworker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:webworker 2>&1 | tee test-output.log
          sed 's/\x1b\[[0-9;]*m//g' test-output.log | awk 'match($0, /Executed [0-9]+ of [0-9]+.*SUCCESS \(/) {split(substr($0, RSTART, RLENGTH), a, " "); s+=a[2]; t+=a[4]; n++} END {printf "TEST SUMMARY: %d of %d tests executed successfully across %d karma suites\n", s, t, n}'
